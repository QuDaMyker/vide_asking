# Server Configuration
server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug"  # debug, release, test
  startup_timeout: "30s"
  shutdown_timeout: "30s"
  read_timeout: "30s"
  write_timeout: "30s"

# Database Configuration
database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  database: "cloud_manager"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "5m"
  migration_path: "file://migrations"

# JWT Configuration
jwt:
  secret: "your-super-secret-key-change-in-production"
  access_expiry: "24h"
  refresh_expiry: "168h"
  issuer: "cloud-manager"

# AWS Configuration
aws:
  access_key_id: ""
  secret_access_key: ""
  region: "us-east-1"
  assume_role_arn: ""

# Google Cloud Configuration
gcp:
  project_id: ""
  credentials_file: ""
  region: "us-central1"
  zone: "us-central1-a"

# Azure Configuration
azure:
  tenant_id: ""
  client_id: ""
  client_secret: ""
  subscription_id: ""

# Email Notification Configuration
email:
  enabled: false
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  username: ""
  password: ""
  from_email: "noreply@example.com"
  from_name: "Cloud Manager"
  use_tls: true

# Telegram Notification Configuration
telegram:
  enabled: false
  token: ""
  chat_id: 0

# Slack Notification Configuration
slack:
  enabled: false
  token: ""
  channel_id: ""
  webhook_url: ""

# Logging Configuration
logging:
  level: "info"  # debug, info, warn, error
  format: "json"  # json, console
  output_path: "stdout"
