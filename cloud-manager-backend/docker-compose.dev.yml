version: '3.8'

# Development Docker Compose - with hot reload and debugging

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cloud-manager-api-dev
    ports:
      - "8080:8080"
      - "2345:2345"  # Delve debugger port
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=cloudmanager
      - DATABASE_PASSWORD=cloudmanager_dev
      - DATABASE_NAME=cloudmanager_dev
      - DATABASE_SSL_MODE=disable
      - JWT_SECRET=dev-jwt-secret-not-for-production
      - JWT_REFRESH_SECRET=dev-refresh-secret-not-for-production
      - JWT_EXPIRES_IN=24h
      - JWT_REFRESH_EXPIRES_IN=168h
      - LOG_LEVEL=debug
      - LOG_DEVELOPMENT=true
      # AWS (use local credentials or set here)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # GCP
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/config/gcp-credentials.json
      # Azure
      - AZURE_SUBSCRIPTION_ID=${AZURE_SUBSCRIPTION_ID:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      # Email
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USERNAME=${EMAIL_USERNAME:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@cloudmanager.local}
      # Telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_DEFAULT_CHAT_ID=${TELEGRAM_DEFAULT_CHAT_ID:-}
      # Slack
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SLACK_DEFAULT_CHANNEL=${SLACK_DEFAULT_CHANNEL:-}
    volumes:
      - .:/app
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloud-manager-dev-network

  postgres:
    image: postgres:16-alpine
    container_name: cloud-manager-postgres-dev
    environment:
      - POSTGRES_USER=cloudmanager
      - POSTGRES_PASSWORD=cloudmanager_dev
      - POSTGRES_DB=cloudmanager_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - cloud-manager-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudmanager -d cloudmanager_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: cloud-manager-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped
    networks:
      - cloud-manager-dev-network

  # MailHog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: cloud-manager-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - cloud-manager-dev-network

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cloud-manager-pgadmin-dev
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@cloudmanager.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - cloud-manager-dev-network

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  go_modules:
    driver: local
  go_build_cache:
    driver: local

networks:
  cloud-manager-dev-network:
    driver: bridge
