version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-manager-api
    ports:
      - "8080:8080"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=cloudmanager
      - DATABASE_PASSWORD=cloudmanager_secret
      - DATABASE_NAME=cloudmanager
      - DATABASE_SSL_MODE=disable
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_REFRESH_SECRET=your-refresh-secret-key-change-in-production
      - LOG_LEVEL=info
      - LOG_DEVELOPMENT=false
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloud-manager-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: cloud-manager-postgres
    environment:
      - POSTGRES_USER=cloudmanager
      - POSTGRES_PASSWORD=cloudmanager_secret
      - POSTGRES_DB=cloudmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - cloud-manager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudmanager -d cloudmanager"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: cloud-manager-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - cloud-manager-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cloud-manager-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@cloudmanager.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - cloud-manager-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  cloud-manager-network:
    driver: bridge
