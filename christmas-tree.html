<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 Interactive 3D Christmas Tree 🎄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#FFCC00',
                            hover: '#E6B800',
                        },
                        dark: {
                            bg: '#000000',
                            card: '#111111',
                            border: '#333333'
                        },
                        xmas: {
                            red: '#FF3B30',
                            green: '#30D158'
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            background: #000000;
            position: relative;
        }
        
        /* Snowflake Animation */
        .snowflake { 
            color: #fff; 
            font-size: 1em; 
            font-family: Arial, sans-serif; 
            text-shadow: 0 0 5px #000; 
            position: fixed; 
            top: -10%; 
            z-index: 9999; 
            user-select: none; 
            cursor: default; 
            animation-name: snowflakes-fall, snowflakes-shake; 
            animation-duration: 10s, 3s; 
            animation-timing-function: linear, ease-in-out; 
            animation-iteration-count: infinite, infinite; 
            animation-play-state: running, running; 
            opacity: 0.8; 
        }
        
        @keyframes snowflakes-fall {
            0% { top: -10%; }
            100% { top: 100%; }
        }
        
        @keyframes snowflakes-shake {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(80px); }
        }
        
        .snowflake:nth-of-type(0) { left: 1%; animation-delay: 0s, 0s; }
        .snowflake:nth-of-type(1) { left: 10%; animation-delay: 1s, 1s; }
        .snowflake:nth-of-type(2) { left: 20%; animation-delay: 6s, .5s; }
        .snowflake:nth-of-type(3) { left: 30%; animation-delay: 4s, 2s; }
        .snowflake:nth-of-type(4) { left: 40%; animation-delay: 2s, 2s; }
        .snowflake:nth-of-type(5) { left: 50%; animation-delay: 8s, 3s; }
        .snowflake:nth-of-type(6) { left: 60%; animation-delay: 5s, 1s; }
        .snowflake:nth-of-type(7) { left: 70%; animation-delay: 3s, 2s; }
        .snowflake:nth-of-type(8) { left: 80%; animation-delay: 7s, 3s; }
        .snowflake:nth-of-type(9) { left: 90%; animation-delay: 9s, 1s; }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 2px 2px 8px rgba(255, 204, 0, 0.8), 0 0 20px rgba(255, 204, 0, 0.5); }
            50% { text-shadow: 2px 2px 15px rgba(255, 204, 0, 1), 0 0 30px rgba(255, 204, 0, 0.8); }
        }
        
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 5px;
            background: #333333;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #FFCC00;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #FFCC00;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }
    </style>
</head>
<body class="antialiased selection:bg-brand selection:text-black">
    <!-- Snowflakes -->
    <div class="snowflakes" aria-hidden="true">
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>
    
    <!-- Header -->
    <div class="fixed top-0 left-0 right-0 z-50 bg-black/80 backdrop-blur-xl border-b border-dark-border">
        <div class="max-w-7xl mx-auto px-6 py-5">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-tree text-xmas-green text-2xl drop-shadow-lg"></i>
                    <h1 class="text-2xl font-bold text-white tracking-tight">Interactive Christmas Tree</h1>
                    <i class="fa-solid fa-candy-cane text-xmas-red text-xl animate-pulse"></i>
                </div>
                <div class="flex items-center gap-2 px-4 py-2 rounded-full bg-brand/10 text-brand font-bold text-sm border border-brand/20">
                    <i class="fa-solid fa-sparkles"></i>
                    <span>3D Experience</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Control Panel -->
    <div class="fixed top-24 left-6 z-50 bg-dark-card/90 backdrop-blur-xl rounded-3xl p-6 border border-gray-800 shadow-[0_8px_32px_rgba(0,0,0,0.4)] max-w-sm">
        <div class="flex items-center gap-2 mb-6">
            <i class="fa-solid fa-sliders text-brand text-xl"></i>
            <h2 class="text-xl font-bold text-white">Controls</h2>
        </div>
        
        <!-- Buttons -->
        <div class="space-y-3 mb-6">
            <button id="toggleMusic" class="w-full bg-gradient-to-r from-xmas-red to-pink-600 text-white font-bold px-6 py-3 rounded-2xl hover:shadow-[0_0_20px_rgba(255,59,48,0.4)] transition-all duration-300 flex items-center justify-center gap-3">
                <i class="fa-solid fa-music text-lg"></i>
                <span>Play Music</span>
            </button>
            
            <button id="toggleRotation" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold px-6 py-3 rounded-2xl hover:shadow-[0_0_20px_rgba(59,130,246,0.4)] transition-all duration-300 flex items-center justify-center gap-3">
                <i class="fa-solid fa-pause text-lg"></i>
                <span>Pause Rotation</span>
            </button>
            
            <div class="grid grid-cols-2 gap-3">
                <button id="toggleSnow" class="bg-gray-800 text-white font-semibold px-4 py-3 rounded-xl hover:bg-gray-700 transition border border-gray-700 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-snowflake text-blue-400"></i>
                    <span class="text-sm">Snow</span>
                </button>
                
                <button id="toggleLights" class="bg-gray-800 text-white font-semibold px-4 py-3 rounded-xl hover:bg-gray-700 transition border border-gray-700 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-lightbulb text-yellow-400"></i>
                    <span class="text-sm">Lights</span>
                </button>
            </div>
        </div>
        
        <!-- Sliders -->
        <div class="space-y-4">
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-semibold text-gray-400 flex items-center gap-2">
                        <i class="fa-solid fa-rotate text-brand"></i>
                        Rotation Speed
                    </label>
                    <span class="text-xs text-brand font-bold">50%</span>
                </div>
                <input type="range" id="rotationSpeed" min="0" max="2" step="0.1" value="0.5" class="w-full">
            </div>
            
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-semibold text-gray-400 flex items-center gap-2">
                        <i class="fa-solid fa-cloud-snow text-blue-400"></i>
                        Snow Intensity
                    </label>
                    <span class="text-xs text-blue-400 font-bold">1000</span>
                </div>
                <input type="range" id="snowIntensity" min="0" max="2000" step="100" value="1000" class="w-full">
            </div>
        </div>
    </div>

    <!-- Info Footer -->
    <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 bg-dark-card/90 backdrop-blur-xl px-6 py-3 rounded-full border border-gray-800 shadow-lg">
        <div class="flex items-center gap-6 text-sm text-gray-400">
            <span class="flex items-center gap-2">
                <i class="fa-solid fa-mouse text-brand"></i>
                <span class="text-white font-medium">Drag to rotate</span>
            </span>
            <span class="w-px h-4 bg-gray-700"></span>
            <span class="flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass text-brand"></i>
                <span class="text-white font-medium">Scroll to zoom</span>
            </span>
            <span class="w-px h-4 bg-gray-700"></span>
            <span class="flex items-center gap-2">
                <kbd class="px-2 py-1 bg-gray-800 rounded text-brand font-bold text-xs">Space</kbd>
                <span class="text-white font-medium">Toggle music</span>
            </span>
        </div>
    </div>
    
    <!-- Made with love -->
    <div class="fixed bottom-6 right-6 z-50 bg-dark-card/90 backdrop-blur-xl px-4 py-2 rounded-full border border-gray-800 text-xs text-gray-400">
        Made with <span class="text-xmas-red">❤️</span> using <span class="text-brand font-bold">Three.js</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x0a1128, 10, 100);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Enhanced Lighting
        const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambientLight);

        const mainSpotLight = new THREE.SpotLight(0xffffff, 1.5);
        mainSpotLight.position.set(0, 30, 15);
        mainSpotLight.castShadow = true;
        mainSpotLight.shadow.mapSize.width = 2048;
        mainSpotLight.shadow.mapSize.height = 2048;
        mainSpotLight.angle = Math.PI / 6;
        mainSpotLight.penumbra = 0.3;
        scene.add(mainSpotLight);
        
        // Add rim lights for depth
        const rimLight1 = new THREE.DirectionalLight(0x4169e1, 0.5);
        rimLight1.position.set(-10, 10, -10);
        scene.add(rimLight1);
        
        const rimLight2 = new THREE.DirectionalLight(0xff6347, 0.3);
        rimLight2.position.set(10, 5, -10);
        scene.add(rimLight2);

        // Christmas Tree
        const treeGroup = new THREE.Group();
        
        // Tree layers (cone shapes) - More realistic
        const treeColors = [0x1a5f1a, 0x165216, 0x124512, 0x0e380e];
        const layers = 8;
        
        for (let i = 0; i < layers; i++) {
            const radius = 4 - (i * 0.42);
            const height = 2.8;
            const geometry = new THREE.ConeGeometry(radius, height, 32);
            const material = new THREE.MeshPhongMaterial({ 
                color: treeColors[i % treeColors.length],
                shininess: 20,
                flatShading: false
            });
            const cone = new THREE.Mesh(geometry, material);
            cone.position.y = i * 2;
            cone.castShadow = true;
            cone.receiveShadow = true;
            treeGroup.add(cone);
        }

        // Tree trunk - More detailed
        const trunkGeometry = new THREE.CylinderGeometry(0.6, 0.8, 2.5, 16);
        const trunkMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x3d2817,
            shininess: 5
        });
        const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
        trunk.position.y = -1.2;
        trunk.castShadow = true;
        treeGroup.add(trunk);
        
        // Tree base/pot
        const potGeometry = new THREE.CylinderGeometry(1.2, 1, 1.5, 16);
        const potMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x8b4513,
            shininess: 10
        });
        const pot = new THREE.Mesh(potGeometry, potMaterial);
        pot.position.y = -2.2;
        pot.castShadow = true;
        treeGroup.add(pot);

        // Beautiful 3D Star on top
        const starGroup = new THREE.Group();
        const createStarShape = () => {
            const shape = new THREE.Shape();
            const outerRadius = 0.6;
            const innerRadius = 0.25;
            const points = 5;
            
            for (let i = 0; i < points * 2; i++) {
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const angle = (i * Math.PI) / points;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                if (i === 0) shape.moveTo(x, y);
                else shape.lineTo(x, y);
            }
            shape.closePath();
            return shape;
        };
        
        const starShape = createStarShape();
        const extrudeSettings = { depth: 0.2, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05 };
        const starGeometry = new THREE.ExtrudeGeometry(starShape, extrudeSettings);
        const starMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xffd700,
            emissive: 0xffaa00,
            emissiveIntensity: 0.8,
            shininess: 100
        });
        
        const star1 = new THREE.Mesh(starGeometry, starMaterial);
        star1.position.z = -0.1;
        const star2 = new THREE.Mesh(starGeometry, starMaterial);
        star2.rotation.z = Math.PI / 5;
        star2.position.z = 0.1;
        
        starGroup.add(star1);
        starGroup.add(star2);
        starGroup.position.y = layers * 2 + 1.5;
        treeGroup.add(starGroup);
        
        // Add star glow
        const starGlowGeometry = new THREE.SphereGeometry(0.8, 16, 16);
        const starGlowMaterial = new THREE.MeshBasicMaterial({
            color: 0xffd700,
            transparent: true,
            opacity: 0.3
        });
        const starGlow = new THREE.Mesh(starGlowGeometry, starGlowMaterial);
        starGroup.add(starGlow);

        // Beautiful Ornaments with better materials
        const ornamentColors = [
            0xdc143c, 0xff4500, 0xffd700, 0x4169e1, 
            0x8a2be2, 0xff1493, 0x00ced1, 0xff6347
        ];
        const ornaments = [];
        
        for (let i = 0; i < 60; i++) {
            const size = 0.15 + Math.random() * 0.15;
            const ornamentGeometry = new THREE.SphereGeometry(size, 16, 16);
            const color = ornamentColors[Math.floor(Math.random() * ornamentColors.length)];
            const ornamentMaterial = new THREE.MeshPhongMaterial({ 
                color: color,
                shininess: 150,
                emissive: color,
                emissiveIntensity: 0.2,
                specular: 0xffffff
            });
            const ornament = new THREE.Mesh(ornamentGeometry, ornamentMaterial);
            
            const layer = Math.floor(Math.random() * layers);
            const angle = Math.random() * Math.PI * 2;
            const radius = (4 - (layer * 0.42)) * 0.7;
            
            ornament.position.x = Math.cos(angle) * radius;
            ornament.position.y = layer * 2 + (Math.random() - 0.5) * 0.8;
            ornament.position.z = Math.sin(angle) * radius;
            
            ornament.userData.initialY = ornament.position.y;
            ornament.userData.phase = Math.random() * Math.PI * 2;
            
            // Add ornament cap
            const capGeometry = new THREE.CylinderGeometry(size * 0.3, size * 0.4, size * 0.5, 8);
            const capMaterial = new THREE.MeshPhongMaterial({ color: 0xffd700, shininess: 100 });
            const cap = new THREE.Mesh(capGeometry, capMaterial);
            cap.position.y = size;
            ornament.add(cap);
            
            ornaments.push(ornament);
            treeGroup.add(ornament);
        }

        // Stunning Ice Flowers
        const iceFlowers = [];
        for (let i = 0; i < 35; i++) {
            const flowerGroup = new THREE.Group();
            
            // Create detailed ice flower with multiple layers
            for (let layer = 0; layer < 2; layer++) {
                const petalCount = layer === 0 ? 6 : 6;
                const petalLength = layer === 0 ? 0.35 : 0.25;
                const rotation = layer === 0 ? 0 : Math.PI / 6;
                
                for (let j = 0; j < petalCount; j++) {
                    const petalGeometry = new THREE.BoxGeometry(petalLength, 0.06, 0.02);
                    const petalMaterial = new THREE.MeshPhongMaterial({ 
                        color: 0xe0f7ff,
                        transparent: true,
                        opacity: 0.85,
                        shininess: 120,
                        emissive: 0xaaddff,
                        emissiveIntensity: 0.4,
                        specular: 0xffffff
                    });
                    const petal = new THREE.Mesh(petalGeometry, petalMaterial);
                    petal.rotation.z = (j * Math.PI * 2) / petalCount + rotation;
                    petal.position.x = Math.cos(petal.rotation.z) * petalLength * 0.3;
                    petal.position.y = Math.sin(petal.rotation.z) * petalLength * 0.3;
                    flowerGroup.add(petal);
                }
            }
            
            // Crystal center
            const centerGeo = new THREE.OctahedronGeometry(0.1);
            const centerMat = new THREE.MeshPhongMaterial({ 
                color: 0xffffff,
                transparent: true,
                opacity: 0.95,
                shininess: 150,
                emissive: 0xccffff,
                emissiveIntensity: 0.5
            });
            const center = new THREE.Mesh(centerGeo, centerMat);
            flowerGroup.add(center);
            
            const treeLayer = Math.floor(Math.random() * layers);
            const angle = Math.random() * Math.PI * 2;
            const radius = (4 - (treeLayer * 0.42)) * 0.75;
            
            flowerGroup.position.x = Math.cos(angle) * radius;
            flowerGroup.position.y = treeLayer * 2 + (Math.random() - 0.5) * 0.6;
            flowerGroup.position.z = Math.sin(angle) * radius;
            
            flowerGroup.userData.initialRotation = Math.random() * Math.PI * 2;
            flowerGroup.userData.phase = Math.random() * Math.PI * 2;
            
            iceFlowers.push(flowerGroup);
            treeGroup.add(flowerGroup);
        }
        
        // Add Ribbon/Garland
        const ribbonPoints = [];
        for (let i = 0; i < 100; i++) {
            const t = i / 100;
            const angle = t * Math.PI * 8;
            const heightPos = t * layers * 2;
            const currentRadius = 4 - (t * layers * 0.42);
            
            ribbonPoints.push(new THREE.Vector3(
                Math.cos(angle) * currentRadius * 0.9,
                heightPos,
                Math.sin(angle) * currentRadius * 0.9
            ));
        }
        
        const ribbonCurve = new THREE.CatmullRomCurve3(ribbonPoints);
        const ribbonGeometry = new THREE.TubeGeometry(ribbonCurve, 100, 0.08, 8, false);
        const ribbonMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xffd700,
            emissive: 0xffaa00,
            emissiveIntensity: 0.3,
            shininess: 80
        });
        const ribbon = new THREE.Mesh(ribbonGeometry, ribbonMaterial);
        treeGroup.add(ribbon);

        // Spectacular Lights System - More lights, more beautiful!
        const lights = [];
        const lightVisuals = [];
        const lightColors = [
            0xff0000, 0xff4500, 0xff6347,  // Reds
            0x00ff00, 0x32cd32, 0x7fff00,  // Greens
            0x0000ff, 0x4169e1, 0x1e90ff,  // Blues
            0xffff00, 0xffd700, 0xffa500,  // Yellows/Golds
            0xff00ff, 0xff1493, 0xda70d6,  // Pinks/Magentas
            0x00ffff, 0x00ced1, 0x48d1cc,  // Cyans
            0xffffff, 0xf0f8ff              // Whites
        ];
        
        // Create multiple light strands wrapping around the tree
        const strandsCount = 8;  // More strands
        const lightsPerStrand = 20;  // More lights per strand
        
        for (let strand = 0; strand < strandsCount; strand++) {
            for (let i = 0; i < lightsPerStrand; i++) {
                const color = lightColors[Math.floor(Math.random() * lightColors.length)];
                const light = new THREE.PointLight(color, 2.5, 7);
                
                const heightRatio = i / lightsPerStrand;
                const layerHeight = heightRatio * (layers * 2);
                const currentRadius = 4 - (heightRatio * layers * 0.42);
                const angle = (strand * Math.PI * 2 / strandsCount) + (i * 0.4);
                
                light.position.x = Math.cos(angle) * currentRadius * 0.88;
                light.position.y = layerHeight;
                light.position.z = Math.sin(angle) * currentRadius * 0.88;
                
                light.userData.phase = Math.random() * Math.PI * 2;
                light.userData.baseIntensity = 2 + Math.random() * 0.5;
                light.userData.twinkleSpeed = 3 + Math.random() * 2;
                
                lights.push(light);
                treeGroup.add(light);
                
                // Beautiful visual bulb with metallic cap
                const bulbGroup = new THREE.Group();
                
                // Glass bulb
                const lightSphere = new THREE.Mesh(
                    new THREE.SphereGeometry(0.14, 16, 16),
                    new THREE.MeshPhongMaterial({ 
                        color: color,
                        transparent: true,
                        opacity: 0.95,
                        emissive: color,
                        emissiveIntensity: 0.8,
                        shininess: 100
                    })
                );
                bulbGroup.add(lightSphere);
                
                // Metallic cap on top
                const capGeo = new THREE.CylinderGeometry(0.06, 0.08, 0.08, 8);
                const capMat = new THREE.MeshPhongMaterial({ 
                    color: 0x888888,
                    shininess: 80,
                    metalness: 0.8
                });
                const cap = new THREE.Mesh(capGeo, capMat);
                cap.position.y = 0.16;
                bulbGroup.add(cap);
                
                // Inner glow core
                const innerGlow = new THREE.Mesh(
                    new THREE.SphereGeometry(0.08, 8, 8),
                    new THREE.MeshBasicMaterial({
                        color: color,
                        transparent: true,
                        opacity: 0.9
                    })
                );
                bulbGroup.add(innerGlow);
                
                bulbGroup.position.copy(light.position);
                lightVisuals.push({ mesh: lightSphere, group: bulbGroup, light: light, innerGlow: innerGlow });
                treeGroup.add(bulbGroup);
                
                // Multi-layer halo for more dramatic glow
                for (let h = 0; h < 3; h++) {
                    const haloSize = 0.25 + (h * 0.15);
                    const haloOpacity = 0.4 - (h * 0.1);
                    const haloGeometry = new THREE.SphereGeometry(haloSize, 12, 12);
                    const haloMaterial = new THREE.MeshBasicMaterial({
                        color: color,
                        transparent: true,
                        opacity: haloOpacity,
                        side: THREE.BackSide
                    });
                    const halo = new THREE.Mesh(haloGeometry, haloMaterial);
                    halo.position.copy(light.position);
                    treeGroup.add(halo);
                }
            }
        }
        
        // Add special accent lights at key positions
        const accentPositions = [
            { y: layers * 2 * 0.9, radius: 0.8, color: 0xffd700 },  // Near star
            { y: layers * 2 * 0.7, radius: 1.5, color: 0xff0000 },
            { y: layers * 2 * 0.5, radius: 2.2, color: 0x00ff00 },
            { y: layers * 2 * 0.3, radius: 2.8, color: 0x0000ff },
            { y: layers * 2 * 0.1, radius: 3.2, color: 0xff00ff }
        ];
        
        accentPositions.forEach(pos => {
            for (let a = 0; a < 6; a++) {
                const angle = (a * Math.PI * 2 / 6);
                const accentLight = new THREE.PointLight(pos.color, 2, 5);
                accentLight.position.x = Math.cos(angle) * pos.radius;
                accentLight.position.y = pos.y;
                accentLight.position.z = Math.sin(angle) * pos.radius;
                accentLight.userData.phase = Math.random() * Math.PI * 2;
                accentLight.userData.baseIntensity = 2;
                accentLight.userData.twinkleSpeed = 2;
                
                lights.push(accentLight);
                treeGroup.add(accentLight);
                
                // Visual for accent lights
                const accentVisual = new THREE.Mesh(
                    new THREE.SphereGeometry(0.12, 12, 12),
                    new THREE.MeshBasicMaterial({
                        color: pos.color,
                        transparent: true,
                        opacity: 0.9
                    })
                );
                accentVisual.position.copy(accentLight.position);
                lightVisuals.push({ mesh: accentVisual, light: accentLight });
                treeGroup.add(accentVisual);
            }
        });

        scene.add(treeGroup);
        treeGroup.position.y = 2;
        
        // Add Presents under the tree
        const presents = [];
        const presentColors = [0xdc143c, 0x4169e1, 0xffd700, 0x32cd32, 0xff1493];
        
        for (let i = 0; i < 8; i++) {
            const presentGroup = new THREE.Group();
            const size = 0.6 + Math.random() * 0.4;
            
            // Present box
            const boxGeometry = new THREE.BoxGeometry(size, size, size);
            const boxMaterial = new THREE.MeshPhongMaterial({ 
                color: presentColors[Math.floor(Math.random() * presentColors.length)],
                shininess: 30
            });
            const box = new THREE.Mesh(boxGeometry, boxMaterial);
            presentGroup.add(box);
            
            // Ribbon horizontal
            const ribbonH = new THREE.Mesh(
                new THREE.BoxGeometry(size * 1.1, size * 0.15, size * 0.15),
                new THREE.MeshPhongMaterial({ color: 0xffd700, shininess: 80 })
            );
            presentGroup.add(ribbonH);
            
            // Ribbon vertical
            const ribbonV = new THREE.Mesh(
                new THREE.BoxGeometry(size * 0.15, size * 0.15, size * 1.1),
                new THREE.MeshPhongMaterial({ color: 0xffd700, shininess: 80 })
            );
            presentGroup.add(ribbonV);
            
            // Bow on top
            const bowGeometry = new THREE.SphereGeometry(size * 0.25, 8, 8);
            const bowMaterial = new THREE.MeshPhongMaterial({ color: 0xff0000, shininess: 50 });
            const bow = new THREE.Mesh(bowGeometry, bowMaterial);
            bow.position.y = size * 0.6;
            bow.scale.set(1.5, 0.8, 1);
            presentGroup.add(bow);
            
            const angle = (i / 8) * Math.PI * 2 + Math.random() * 0.5;
            const distance = 2.5 + Math.random() * 1.5;
            
            presentGroup.position.x = Math.cos(angle) * distance;
            presentGroup.position.y = size * 0.5;
            presentGroup.position.z = Math.sin(angle) * distance;
            presentGroup.rotation.y = Math.random() * Math.PI;
            
            presentGroup.castShadow = true;
            presents.push(presentGroup);
            scene.add(presentGroup);
        }

        // Snow particles
        let snowParticles;
        let snowGeometry;
        const createSnow = (count) => {
            if (snowParticles) {
                scene.remove(snowParticles);
                snowGeometry.dispose();
            }
            
            snowGeometry = new THREE.BufferGeometry();
            const positions = [];
            const velocities = [];
            
            for (let i = 0; i < count; i++) {
                positions.push(
                    Math.random() * 40 - 20,
                    Math.random() * 40,
                    Math.random() * 40 - 20
                );
                velocities.push(Math.random() * 0.02 + 0.01);
            }
            
            snowGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            snowGeometry.userData.velocities = velocities;
            
            const snowMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.15,
                transparent: true,
                opacity: 0.8
            });
            
            snowParticles = new THREE.Points(snowGeometry, snowMaterial);
            scene.add(snowParticles);
        };
        
        createSnow(1000);

        // Beautiful snowy ground
        const groundGeometry = new THREE.CircleGeometry(35, 64);
        const groundMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xf0f8ff,
            shininess: 40,
            specular: 0x444444,
            side: THREE.DoubleSide
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // Add stars in background
        const starFieldGeometry = new THREE.BufferGeometry();
        const starFieldVertices = [];
        for (let i = 0; i < 800; i++) {
            const x = (Math.random() - 0.5) * 200;
            const y = Math.random() * 100 + 20;
            const z = (Math.random() - 0.5) * 200;
            starFieldVertices.push(x, y, z);
        }
        starFieldGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starFieldVertices, 3));
        const starFieldMaterial = new THREE.PointsMaterial({ 
            color: 0xffffff, 
            size: 0.3,
            transparent: true,
            opacity: 0.8
        });
        const starField = new THREE.Points(starFieldGeometry, starFieldMaterial);
        scene.add(starField);

        // Audio setup - Real Christmas Music
        const audio = new Audio();
        audio.loop = true;
        audio.volume = 0.3;
        // Using actual Christmas music (Jingle Bells)
        audio.src = 'https://cdn.pixabay.com/download/audio/2021/11/23/audio_5e5b2ab116.mp3';
        
        let musicPlaying = false;
        let isRotating = true;
        let showSnow = true;
        let showLights = true;
        let rotationSpeed = 0.005;

        // Controls
        document.getElementById('toggleMusic').addEventListener('click', function() {
            if (musicPlaying) {
                audio.pause();
                this.textContent = '🎵 Play Music';
                musicPlaying = false;
            } else {
                audio.play().catch(e => console.log('Audio play failed:', e));
                this.textContent = '🔇 Pause Music';
                musicPlaying = true;
            }
        });

        document.getElementById('toggleRotation').addEventListener('click', function() {
            isRotating = !isRotating;
            this.textContent = isRotating ? '⏸️ Pause Rotation' : '▶️ Resume Rotation';
        });

        document.getElementById('toggleSnow').addEventListener('click', function() {
            showSnow = !showSnow;
            snowParticles.visible = showSnow;
            this.textContent = showSnow ? '❄️ Hide Snow' : '❄️ Show Snow';
        });

        document.getElementById('toggleLights').addEventListener('click', function() {
            showLights = !showLights;
            lights.forEach(light => light.visible = showLights);
            this.textContent = showLights ? '💡 Hide Lights' : '💡 Show Lights';
        });

        document.getElementById('rotationSpeed').addEventListener('input', function(e) {
            rotationSpeed = parseFloat(e.target.value) * 0.01;
        });

        document.getElementById('snowIntensity').addEventListener('input', function(e) {
            createSnow(parseInt(e.target.value));
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                document.getElementById('toggleMusic').click();
            }
        });

        // Mouse controls
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        renderer.domElement.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                
                camera.position.x += deltaX * 0.05;
                camera.position.y -= deltaY * 0.05;
                camera.lookAt(scene.position);
                
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        renderer.domElement.addEventListener('mouseup', () => {
            isDragging = false;
        });

        renderer.domElement.addEventListener('wheel', (e) => {
            e.preventDefault();
            camera.position.z += e.deltaY * 0.01;
            camera.position.z = Math.max(10, Math.min(40, camera.position.z));
        });

        // Animation loop
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Rotate tree
            if (isRotating) {
                treeGroup.rotation.y += rotationSpeed;
            }

            // Animate star
            starGroup.rotation.y += 0.02;
            starGroup.rotation.z = Math.sin(time) * 0.1;
            starGroup.position.y = layers * 2 + 1.5 + Math.sin(time * 2) * 0.15;
            starGlow.scale.set(
                1 + Math.sin(time * 3) * 0.2,
                1 + Math.sin(time * 3) * 0.2,
                1 + Math.sin(time * 3) * 0.2
            );

            // Animate ornaments
            ornaments.forEach((ornament, i) => {
                ornament.position.y = ornament.userData.initialY + Math.sin(time * 2 + ornament.userData.phase) * 0.08;
                ornament.rotation.y += 0.008;
                ornament.material.emissiveIntensity = 0.2 + Math.sin(time * 3 + ornament.userData.phase) * 0.1;
            });
            
            // Animate presents
            presents.forEach((present, i) => {
                present.position.y = present.children[0].geometry.parameters.width * 0.5 + Math.sin(time + i) * 0.05;
            });

            // Animate ice flowers
            iceFlowers.forEach((flower, i) => {
                flower.rotation.z = flower.userData.initialRotation + time * 0.5;
                flower.children.forEach((child, j) => {
                    if (child.geometry && child.geometry.type === 'BoxGeometry') {
                        child.material.emissiveIntensity = 0.3 + Math.sin(time * 2 + flower.userData.phase) * 0.2;
                    }
                });
            });

            // Spectacular light animation with multiple effects
            lights.forEach((light, i) => {
                const speed = light.userData.twinkleSpeed || 4;
                const twinkle = Math.sin(time * speed + light.userData.phase) * 0.5 + 0.5;
                const pulse = Math.sin(time * 2 + light.userData.phase * 2) * 0.3 + 0.7;
                const shimmer = Math.sin(time * 6 + light.userData.phase * 3) * 0.2 + 0.8;
                light.intensity = light.userData.baseIntensity * twinkle * pulse * shimmer;
            });
            
            // Animate light visuals with breathing and rotation
            lightVisuals.forEach((visual, i) => {
                const breathe = 1 + Math.sin(time * 4 + i * 0.3) * 0.25;
                const spin = Math.sin(time * 3 + i * 0.5) * 0.15;
                
                visual.mesh.scale.set(breathe, breathe, breathe);
                
                if (visual.group) {
                    visual.group.rotation.y += 0.02;
                }
                
                if (visual.innerGlow) {
                    const glowPulse = 0.9 + Math.sin(time * 5 + i * 0.4) * 0.3;
                    visual.innerGlow.scale.set(glowPulse, glowPulse, glowPulse);
                    visual.innerGlow.material.opacity = 0.6 + Math.sin(time * 4 + i * 0.3) * 0.3;
                }
                
                // Add slight swaying motion
                if (visual.group) {
                    visual.group.position.x = visual.light.position.x + Math.sin(time * 2 + i * 0.2) * 0.02;
                }
            });

            // Animate snow
            if (snowParticles && showSnow) {
                const positions = snowGeometry.attributes.position.array;
                const velocities = snowGeometry.userData.velocities;
                
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i + 1] -= velocities[i / 3];
                    
                    if (positions[i + 1] < 0) {
                        positions[i + 1] = 40;
                    }
                }
                
                snowGeometry.attributes.position.needsUpdate = true;
            }

            camera.lookAt(0, 5, 0);
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
